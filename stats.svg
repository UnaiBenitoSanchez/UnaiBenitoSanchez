<svg width="900" height="160" viewBox="0 0 900 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes shimmer  { 0%,100%{opacity:.2} 50%{opacity:.5} }
      @keyframes scan     { 0%{transform:translateY(0);opacity:.04} 50%{opacity:.09} 100%{transform:translateY(162px);opacity:.04} }
      @keyframes fadein   { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      @keyframes fillin   { from{width:0} }
      @keyframes pulse    { 0%,100%{opacity:1} 50%{opacity:.4} }
      @keyframes ringfill { from{stroke-dashoffset:220} to{stroke-dashoffset:38} }
      .sh  { animation:shimmer 4s ease-in-out infinite }
      .sc  { animation:scan 5s linear infinite }
      .f1  { animation:fadein .5s ease .2s  both }
      .f2  { animation:fadein .5s ease .4s  both }
      .f3  { animation:fadein .5s ease .6s  both }
      .f4  { animation:fadein .5s ease .8s  both }
      .f5  { animation:fadein .5s ease 1.0s both }
      .f6  { animation:fadein .5s ease 1.2s both }
      .f7  { animation:fadein .5s ease 1.4s both }
      .f8  { animation:fadein .5s ease 1.6s both }
      .bar1 { animation:fillin .8s ease 1.0s both }
      .bar2 { animation:fillin .8s ease 1.1s both }
      .bar3 { animation:fillin .8s ease 1.2s both }
      .bar4 { animation:fillin .8s ease 1.3s both }
      .bar5 { animation:fillin .8s ease 1.4s both }
      .ring { animation:ringfill 1.2s ease 1.0s both; stroke-dasharray:220; stroke-dashoffset:38; }
      .dot  { animation:pulse 2s ease-in-out infinite }
    </style>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b091d"/>
      <stop offset="50%"  stop-color="#130f30"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="sgl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <!-- bar gradients -->
    <linearGradient id="bkt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bjs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#eab308"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="bcss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="bphp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bhtml" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <!-- ring gradient -->
    <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- divider -->
    <linearGradient id="div" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#5b3fc0" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="900" height="160" fill="url(#sbg)" rx="12"/>

  <!-- grid -->
  <g stroke="#1e1545" stroke-width=".5" opacity=".4">
    <line x1="0"   y1="53"  x2="900" y2="53"/>
    <line x1="0"   y1="106" x2="900" y2="106"/>
    <line x1="150" y1="0"   x2="150" y2="160"/>
    <line x1="300" y1="0"   x2="300" y2="160"/>
    <line x1="450" y1="0"   x2="450" y2="160"/>
    <line x1="600" y1="0"   x2="600" y2="160"/>
    <line x1="750" y1="0"   x2="750" y2="160"/>
  </g>

  <!-- glow line center -->
  <rect class="sh" x="0" y="80" width="900" height="1" fill="url(#sgl)"/>

  <!-- scanline -->
  <rect class="sc" x="0" y="0" width="900" height="1.5" fill="#a78bfa" rx="1"/>

  <!-- border -->
  <rect x="0" y="0" width="900" height="160" fill="none" stroke="#2d1f5e" stroke-width="1" rx="12"/>
  <rect x="1" y="1" width="898" height="158" fill="none" stroke="#4a2fa0" stroke-width=".5" stroke-opacity=".4" rx="11"/>

  <!-- corner marks -->
  <g fill="none" stroke="#5b3fc0" stroke-width="1.5" opacity=".6">
    <path d="M10 22 L10 10 L22 10"/>
    <path d="M878 10 L890 10 L890 22"/>
    <path d="M10 138 L10 150 L22 150"/>
    <path d="M878 150 L890 150 L890 138"/>
  </g>

  <!-- vertical divider -->
  <rect x="449" y="0" width="1" height="160" fill="url(#div)"/>

  <!-- ══════════════════════════════════════════
       LEFT PANEL — GitHub Statistics
  ══════════════════════════════════════════ -->

  <!-- panel title -->
  <text class="f1" x="28" y="35" font-family="'Courier New',monospace" font-size="10" fill="#9061f9" letter-spacing="1">~/stats $</text>
  <text class="f1" x="100" y="35" font-family="'Courier New',monospace" font-size="11" fill="#ddd6fe" letter-spacing="2">My GitHub Statistics</text>

  <!-- stat rows -->
  <!-- Stars -->
  <g class="f2">
    <text x="40" y="60" font-family="'Courier New',monospace" font-size="10" fill="#eab308">★</text>
    <text x="58" y="60" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">Total Stars:</text>
    <text x="178" y="60" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">10</text>
  </g>
  <!-- Commits -->
  <g class="f3">
    <text x="40" y="78" font-family="'Courier New',monospace" font-size="10" fill="#a78bfa">↻</text>
    <text x="58" y="78" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">Total Commits:</text>
    <text x="178" y="78" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">590</text>
  </g>
  <!-- PRs -->
  <g class="f4">
    <text x="40" y="96" font-family="'Courier New',monospace" font-size="10" fill="#a78bfa">⇅</text>
    <text x="58" y="96" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">Total PRs:</text>
    <text x="178" y="96" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">9</text>
  </g>
  <!-- Issues -->
  <g class="f5">
    <text x="40" y="114" font-family="'Courier New',monospace" font-size="10" fill="#a78bfa">◎</text>
    <text x="58" y="114" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">Total Issues:</text>
    <text x="178" y="114" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">8</text>
  </g>
  <!-- Contributed -->
  <g class="f6">
    <text x="40" y="132" font-family="'Courier New',monospace" font-size="10" fill="#a78bfa">▣</text>
    <text x="58" y="132" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">Contributed to:</text>
    <text x="178" y="132" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">0</text>
  </g>

  <!-- Grade ring -->
  <g class="f2">
    <!-- ring track -->
    <circle cx="370" cy="95" r="35" fill="none" stroke="#1e1545" stroke-width="6"/>
    <!-- ring fill -->
    <circle class="ring" cx="370" cy="95" r="35" fill="none"
            stroke="url(#rg)" stroke-width="6"
            stroke-linecap="round"
            transform="rotate(-90 370 95)"/>
    <!-- grade text -->
    <text x="370" y="99" text-anchor="middle"
          font-family="'Courier New',monospace" font-size="16" font-weight="bold"
          fill="#e0d7ff">A+</text>
  </g>

  <!-- ══════════════════════════════════════════
       RIGHT PANEL — Programming Languages
  ══════════════════════════════════════════ -->

  <!-- panel title -->
  <text class="f1" x="472" y="35" font-family="'Courier New',monospace" font-size="10" fill="#9061f9" letter-spacing="1">~/langs $</text>
  <text class="f1" x="546" y="35" font-family="'Courier New',monospace" font-size="11" fill="#ddd6fe" letter-spacing="2">My Programming Languages</text>

  <!-- combined bar (full width of right panel) -->
  <!-- track -->
  <rect class="f2" x="472" y="48" width="405" height="7" fill="#1e1545" rx="3.5"/>
  <!-- segments (proportional: Kotlin 82.58, JS 5.84, CSS 1.78, PHP 5.89, HTML 3.91) -->
  <rect class="bar1" x="472" y="48" width="334" height="7" fill="url(#bkt)"   rx="3.5"/>
  <rect class="bar2" x="806" y="48" width="24"  height="7" fill="url(#bjs)"   rx="0"/>
  <rect class="bar3" x="830" y="48" width="7"   height="7" fill="url(#bcss)"  rx="0"/>
  <rect class="bar4" x="837" y="48" width="24"  height="7" fill="url(#bphp)"  rx="0"/>
  <rect class="bar5" x="861" y="48" width="16"  height="7" fill="url(#bhtml)" rx="3.5"/>

  <!-- legend — col 1 -->
  <g class="f3">
    <circle cx="480" cy="78" r="4" fill="url(#bkt)"/>
    <text x="490" y="82" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">Kotlin</text>
    <text x="538" y="82" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">(82.58%)</text>
  </g>
  <g class="f4">
    <circle cx="480" cy="100" r="4" fill="url(#bjs)"/>
    <text x="490" y="104" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">JavaScript</text>
    <text x="562" y="104" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">(5.84%)</text>
  </g>
  <g class="f5">
    <circle cx="480" cy="122" r="4" fill="url(#bcss)"/>
    <text x="490" y="126" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">CSS</text>
    <text x="514" y="126" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">(1.78%)</text>
  </g>

  <!-- legend — col 2 -->
  <g class="f3">
    <circle cx="660" cy="78" r="4" fill="url(#bphp)"/>
    <text x="670" y="82" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">PHP</text>
    <text x="694" y="82" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">(5.89%)</text>
  </g>
  <g class="f4">
    <circle cx="660" cy="100" r="4" fill="url(#bhtml)"/>
    <text x="670" y="104" font-family="'Courier New',monospace" font-size="10" fill="#c4b5fd">HTML</text>
    <text x="699" y="104" font-family="'Courier New',monospace" font-size="10" fill="#ffffff" font-weight="bold">(3.91%)</text>
  </g>

</svg>
