<svg width="440" height="130" viewBox="0 0 440 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes gb2 { 0%,100%{stroke-opacity:.35} 50%{stroke-opacity:.9} }
      @keyframes fi2 { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      .b2{ animation:gb2 3.2s ease-in-out 1.6s infinite }
      .g1{ animation:fi2 .4s ease .2s both }
      .g2{ animation:fi2 .4s ease .4s both }
      .g3{ animation:fi2 .4s ease .6s both }
      .g4{ animation:fi2 .4s ease .8s both }
    </style>
  </defs>
  <rect width="440" height="130" fill="#0d0b1e" rx="8"/>
  <rect class="b2" x=".75" y=".75" width="438.5" height="128.5" fill="none" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <rect x="20" y="0" width="100" height="2" fill="#7c3aed" rx="1"/>
  <rect x="16" y="16" width="36" height="36" fill="#1a1040" rx="6"/>
  <text x="34" y="40" font-size="20" text-anchor="middle">🎲</text>
  <text class="g1" x="62" y="30" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#ede9fe">AI Dungeon Master</text>
  <rect class="g2" x="62" y="38" width="10" height="10" fill="#3572a5" rx="5"/>
  <text class="g2" x="77" y="47" font-family="'Courier New',monospace" font-size="11" fill="#6b5fa0">Kotlin  ·  Android</text>
  <line x1="16" y1="62" x2="424" y2="62" stroke="#1e1a4a" stroke-width="1"/>
  <text class="g3" x="16" y="80" font-family="'Courier New',monospace" font-size="11" fill="#9d89cc">Aplicación de rol con IA generativa como</text>
  <text class="g3" x="16" y="95" font-family="'Courier New',monospace" font-size="11" fill="#9d89cc">motor narrativo — TFG 2-DAM.</text>
  <text class="g4" x="16" y="118" font-family="'Courier New',monospace" font-size="10" fill="#3d2a6e">⌥  AIDungeonMaster_2-DAM_TFG</text>
</svg>
