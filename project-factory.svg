<svg width="440" height="130" viewBox="0 0 440 130" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes gb1 { 0%,100%{stroke-opacity:.35} 50%{stroke-opacity:.9} }
      @keyframes fi  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      .b { animation:gb1 3.2s ease-in-out infinite }
      .f1{ animation:fi .4s ease .1s both }
      .f2{ animation:fi .4s ease .3s both }
      .f3{ animation:fi .4s ease .5s both }
      .f4{ animation:fi .4s ease .7s both }
    </style>
  </defs>
  <rect width="440" height="130" fill="#0d0b1e" rx="8"/>
  <!-- animated border -->
  <rect class="b" x=".75" y=".75" width="438.5" height="128.5" fill="none" stroke="#7c3aed" stroke-width="1.5" rx="8"/>
  <!-- top accent line -->
  <rect x="20" y="0" width="140" height="2" fill="#7c3aed" rx="1"/>
  <!-- icon bg -->
  <rect x="16" y="16" width="36" height="36" fill="#1a1040" rx="6"/>
  <text x="34" y="40" font-size="20" text-anchor="middle">🏭</text>
  <!-- title -->
  <text class="f1" x="62" y="30" font-family="'Courier New',monospace" font-size="14" font-weight="bold" fill="#ede9fe">TFG · Factory Management</text>
  <!-- lang badge -->
  <rect class="f2" x="62" y="38" width="10" height="10" fill="#b07219" rx="5"/>
  <text class="f2" x="77" y="47" font-family="'Courier New',monospace" font-size="11" fill="#6b5fa0">Java  ·  Spring Boot</text>
  <!-- divider -->
  <line x1="16" y1="62" x2="424" y2="62" stroke="#1e1a4a" stroke-width="1"/>
  <!-- description -->
  <text class="f3" x="16" y="80" font-family="'Courier New',monospace" font-size="11" fill="#9d89cc">Sistema de gestión de fábricas desarrollado</text>
  <text class="f3" x="16" y="95" font-family="'Courier New',monospace" font-size="11" fill="#9d89cc">como Trabajo de Fin de Grado — 2-DAM.</text>
  <!-- repo path -->
  <text class="f4" x="16" y="118" font-family="'Courier New',monospace" font-size="10" fill="#3d2a6e">⌥  TFG_UnaiBenito_FactoryManagement</text>
</svg>
