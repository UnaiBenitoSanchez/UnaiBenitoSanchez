<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float1  { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:.7} 90%{opacity:.3} 100%{transform:translateY(-70px) translateX(10px);opacity:0} }
      @keyframes float2  { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:.5} 90%{opacity:.2} 100%{transform:translateY(-60px) translateX(-8px);opacity:0} }
      @keyframes float3  { 0%{transform:translateY(0) translateX(0);opacity:0} 10%{opacity:.6} 90%{opacity:.25} 100%{transform:translateY(-80px) translateX(5px);opacity:0} }
      @keyframes shimmer { 0%,100%{opacity:.2} 50%{opacity:.5} }
      @keyframes scan    { 0%{transform:translateY(0);opacity:.04} 50%{opacity:.1} 100%{transform:translateY(102px);opacity:.04} }
      @keyframes fadein  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
      .sh { animation:shimmer 4s ease-in-out infinite }
      .sc { animation:scan 5s linear infinite }
      .fi { animation:fadein .8s ease .3s both }
    </style>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0b091d"/>
      <stop offset="50%"  stop-color="#130f30"/>
      <stop offset="100%" stop-color="#0a0818"/>
    </linearGradient>
    <linearGradient id="fgl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#a78bfa" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fgl2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#c4b5fd" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="100" fill="url(#fbg)" rx="12"/>

  <!-- subtle grid -->
  <g stroke="#1e1545" stroke-width=".5" opacity=".4">
    <line x1="0"   y1="33"  x2="900" y2="33"/>
    <line x1="0"   y1="66"  x2="900" y2="66"/>
    <line x1="150" y1="0"   x2="150" y2="100"/>
    <line x1="300" y1="0"   x2="300" y2="100"/>
    <line x1="450" y1="0"   x2="450" y2="100"/>
    <line x1="600" y1="0"   x2="600" y2="100"/>
    <line x1="750" y1="0"   x2="750" y2="100"/>
  </g>

  <!-- glow lines -->
  <rect class="sh" x="0" y="1"  width="900" height="1"   fill="url(#fgl)"/>
  <rect           x="50" y="50" width="800" height=".5"  fill="url(#fgl2)"/>

  <!-- scanline -->
  <rect class="sc" x="0" y="0" width="900" height="1.5" fill="#a78bfa" rx="1"/>

  <!-- border -->
  <rect x="0" y="0" width="900" height="100" fill="none" stroke="#2d1f5e" stroke-width="1" rx="12"/>
  <rect x="1" y="1" width="898" height="98"  fill="none" stroke="#4a2fa0" stroke-width=".5" stroke-opacity=".4" rx="11"/>

  <!-- corner marks -->
  <g fill="none" stroke="#5b3fc0" stroke-width="1.5" opacity=".6">
    <path d="M10 18 L10 10 L18 10"/>
    <path d="M882 10 L890 10 L890 18"/>
    <path d="M10 82 L10 90 L18 90"/>
    <path d="M882 90 L890 90 L890 82"/>
  </g>

  <!-- floating particles -->
  <circle cx="55"  cy="88" r="1.5" fill="#a78bfa" style="animation:float1 6.2s linear 0s    infinite"/>
  <circle cx="130" cy="90" r="1"   fill="#c4b5fd" style="animation:float2 7.1s linear 1.1s  infinite"/>
  <circle cx="210" cy="85" r="1.8" fill="#7c3aed" style="animation:float3 5.4s linear 0.4s  infinite"/>
  <circle cx="290" cy="91" r="1.2" fill="#a78bfa" style="animation:float1 8.0s linear 2.0s  infinite"/>
  <circle cx="370" cy="87" r="1"   fill="#e0d7ff" style="animation:float2 6.8s linear 0.7s  infinite"/>
  <circle cx="450" cy="90" r="1.5" fill="#a78bfa" style="animation:float3 7.5s linear 3.1s  infinite"/>
  <circle cx="530" cy="85" r="1"   fill="#7c3aed" style="animation:float1 5.8s linear 1.6s  infinite"/>
  <circle cx="610" cy="89" r="1.2" fill="#c4b5fd" style="animation:float2 9.0s linear 0.2s  infinite"/>
  <circle cx="690" cy="86" r="1.8" fill="#a78bfa" style="animation:float3 6.3s linear 2.4s  infinite"/>
  <circle cx="770" cy="90" r="1.2" fill="#e0d7ff" style="animation:float1 7.8s linear 1.0s  infinite"/>
  <circle cx="845" cy="87" r="1.4" fill="#7c3aed" style="animation:float2 6.0s linear 3.5s  infinite"/>

  <!-- copyright text -->
  <text class="fi" x="450" y="56" text-anchor="middle"
        font-family="'Courier New',monospace" font-size="11"
        fill="#c4b5fd" letter-spacing="3">© UNAI BENITO SÁNCHEZ</text>

  <!-- decorative dashes -->
  <text class="fi" x="450" y="38" text-anchor="middle"
        font-family="'Courier New',monospace" font-size="9"
        fill="#4a2fa0" letter-spacing="6">· · · · · · · · · · · · · · · · ·</text>
</svg>
