<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes blink  { 0%,100%{opacity:1} 50%{opacity:0} }
      @keyframes appear { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
      @keyframes bgpulse{ 0%,100%{opacity:.03} 50%{opacity:.07} }
      .l1 { animation:appear .35s ease .3s  both }
      .l2 { animation:appear .35s ease .9s  both }
      .l3 { animation:appear .35s ease 1.5s both }
      .l4 { animation:appear .35s ease 2.1s both }
      .l5 { animation:appear .35s ease 2.7s both }
      .l6 { animation:appear .35s ease 3.3s both }
      .l7 { animation:appear .35s ease 3.9s both }
      .cur{ animation:blink 1s step-end 3.9s infinite }
      .bg { animation:bgpulse 3s ease-in-out infinite }
    </style>
  </defs>

  <!-- window -->
  <rect width="900" height="210" fill="#0d0b1e" rx="10"/>
  <!-- titlebar -->
  <rect width="900" height="38" fill="#13103a" rx="10"/>
  <rect y="28" width="900" height="10" fill="#13103a"/>
  <!-- traffic lights -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="43" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <!-- title -->
  <text x="450" y="24" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#4a3a7a">unai@dev  ~  terminal</text>
  <!-- separator -->
  <line x1="0" y1="38" x2="900" y2="38" stroke="#1e1a4a" stroke-width="1"/>

  <!-- bg scanline subtle -->
  <rect class="bg" x="0" y="38" width="900" height="172" fill="#a78bfa"/>

  <!-- line numbers / gutter -->
  <g font-family="'Courier New',monospace" font-size="11" fill="#2d235a">
    <text x="18" y="68">1</text>
    <text x="18" y="88">2</text>
    <text x="18" y="108">3</text>
    <text x="18" y="128">4</text>
    <text x="18" y="148">5</text>
    <text x="18" y="168">6</text>
    <text x="18" y="190">7</text>
  </g>
  <line x1="36" y1="42" x2="36" y2="210" stroke="#1e1a4a" stroke-width="1"/>

  <!-- code lines -->
  <g font-family="'Courier New',monospace" font-size="13">
    <text class="l1" x="50" y="68">
      <tspan fill="#7c3aed">~/unai</tspan><tspan fill="#4a3a7a"> $ </tspan><tspan fill="#e0d7ff">cat about.yml</tspan>
    </text>
    <text class="l2" x="50" y="88">
      <tspan fill="#374151">───────────────────────────────────────</tspan>
    </text>
    <text class="l3" x="50" y="108">
      <tspan fill="#6d4fc0">name</tspan><tspan fill="#4a3a7a">:      </tspan><tspan fill="#a78bfa">"Unai Benito Sánchez"</tspan>
    </text>
    <text class="l4" x="50" y="128">
      <tspan fill="#6d4fc0">role</tspan><tspan fill="#4a3a7a">:      </tspan><tspan fill="#a78bfa">"Software Developer — Full Stack"</tspan>
    </text>
    <text class="l5" x="50" y="148">
      <tspan fill="#6d4fc0">focus</tspan><tspan fill="#4a3a7a">:     </tspan><tspan fill="#7c3aed">[ </tspan><tspan fill="#c4b5fd">"Web"</tspan><tspan fill="#4a3a7a">, </tspan><tspan fill="#c4b5fd">"Cross-Platform Apps"</tspan><tspan fill="#7c3aed"> ]</tspan>
    </text>
    <text class="l6" x="50" y="168">
      <tspan fill="#6d4fc0">principle</tspan><tspan fill="#4a3a7a">: </tspan><tspan fill="#a78bfa">"If it runs twice, automate it."</tspan>
    </text>
    <text class="l7" x="50" y="190">
      <tspan fill="#7c3aed">~/unai</tspan><tspan fill="#4a3a7a"> $ </tspan><tspan fill="#e0d7ff">_</tspan><tspan class="cur" fill="#a78bfa">▌</tspan>
    </text>
  </g>
</svg>
